# smci355 cluster config for the K3.1 EP x IO runs (copied from k31-umbp-20261112/config); same layout as
# k3-vllm-umbp-connector-20261014/src/srt-slurm/srtslurm.yaml.
cluster: mi355x-amds
default_partition: Compute-Group01
default_time_limit: '04:00:00'
gpus_per_node: 8
network_interface: enp81s0f1
srtctl_root: /apps/yutongwu/store-vllm/k3-vllm-umbp-connector-20261014/src/srt-slurm
output_dir: /apps/yutongwu/store-vllm/k31-vllm-ep-io-smci355-20261119/results/e2/srtctl-outputs
model_paths:
  Kimi-K3.1-Pro: /perf_apps/data/models/Kimi-K3.1-Pro
default_health_check:
  max_attempts: 720
  interval_seconds: 10
containers:
  vllm-k31-umbp-base: /apps/yutongwu/store-vllm/k31-umbp-20261112/images/local_vllm-k31-umbp_f5d93296-m779-7e235579-base.sqsh
  vllm-k31-apex: /apps/yutongwu/store-vllm/k31-umbp-20261112/images/yukiozzz_vllm-openai-rocm_apex-k31-umbp-combined-1111-r03.sqsh
  vllm-k31-ms: /apps/yutongwu/store-vllm/k31-umbp-20261112/images/yukiozzz_vllm-openai-rocm_k31-ms-1114.sqsh
default_mounts:
  /apps/yutongwu/store-vllm/k3-vllm-umbp-connector-20261014/hf-home: /hf_hub_cache
  /dev/kfd: /dev/kfd
  /dev/dri: /dev/dri
  /etc/slurm: /etc/slurm
  /apps/yutongwu/store-vllm/k3-vllm-umbp-connector-20261014/aiperf-cache: /aiperf_mmap_cache
use_gpus_per_node_directive: true
use_segment_sbatch_directive: false
use_exclusive_sbatch_directive: true
default_sbatch_directives:
  cpus-per-task: '128'
visible_devices_env: ROCR_VISIBLE_DEVICES
default_gpu_exporter: null
nginx_raise_ulimit: false
preflight: false
default_bash_preamble: |-
  export SGLANG_CACHE_DIR=/tmp/sglang-cache SGLANG_JIT_CACHE_DIR=/tmp/sglang-cache/jit
  unset HIP_VISIBLE_DEVICES
