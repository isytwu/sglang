syntax = "proto3";

package kv_indexer.v1;

// Storage tier for externally managed KV cache blocks.
enum TierType {
  TIER_UNKNOWN = 0;
  TIER_HBM = 1;
  TIER_DRAM = 2;
  TIER_SSD = 3;
}

// How a single KV component participates in prefix matching. The indexer treats
// component names as opaque labels; the rule (supplied by the worker's
// WorkerCacheSpec) is what drives the match, so the indexer never hardcodes
// full/swa/mamba semantics.
enum MatchRule {
  RULE_UNKNOWN = 0;
  // Path component (e.g. full attention): must be resident on every block of the
  // reusable prefix. A gap ends the prefix.
  RULE_CONTIGUOUS = 1;
  // Boundary/checkpoint component (e.g. mamba): only the candidate boundary block
  // must carry it. Sparse checkpoints; a request whose boundary never reaches one
  // does not match.
  RULE_EXACT_BOUNDARY = 2;
  // Trailing-window component (e.g. sliding-window attention): the candidate
  // boundary is valid only if the component is resident contiguously over at
  // least `window_tokens` tokens immediately preceding the boundary. Older blocks
  // beyond the window need not carry it.
  RULE_TRAILING_WINDOW = 3;
}

// One component's static match parameters, as declared by a worker. All fields
// are opaque to the indexer except as they feed the generic rule engine.
message ComponentRule {
  // Opaque component label as it appears on the wire (e.g. "full"/"swa"/"mamba").
  string name = 1;
  MatchRule rule = 2;
  // Sliding-window size in tokens; meaningful only for RULE_TRAILING_WINDOW.
  uint32 window_tokens = 3;
  // Tiers this component can be served from. Intersected with the indexer's
  // servable set (V1: HBM+DRAM) at query time.
  repeated TierType available_tiers = 4;
}

// A worker's versioned cache specification: which components it reports and how
// each participates in prefix matching. Absent on a worker means legacy /
// full-only (whole-block) behaviour.
message WorkerCacheSpec {
  uint32 version = 1;
  repeated ComponentRule components = 2;
}

// The set of KV components resident for a single (hash, tier) placement. A
// REPLACE snapshot, index-aligned with ExternalKvAction.hashes. An empty set
// means legacy whole-block placement (base component only).
message ComponentSet {
  repeated string components = 1;
}

message MatchExternalKvRequest {
  // MVP semantics: these are block-level hashes to match against placement
  // metadata. The indexer returns block placement matches and does not compute
  // the longest reusable prefix.
  repeated string hashes = 1;

  // When true, only hashes that are actually matched should increase hit
  // counters. Diagnostic callers should leave this false.
  bool count_as_hit = 2;
}

// The kind of mutation a single ExternalKvAction carries. A whole SGLang
// KVEventBatch is applied in one call while preserving exact action order.
enum ExternalKvActionType {
  ACTION_UNKNOWN = 0;
  ACTION_REPORT = 1;
  ACTION_REVOKE = 2;
  ACTION_CLEAR_ALL_AT_TIER = 3;
}

message ExternalKvAction {
  ExternalKvActionType type = 1;
  TierType tier = 2;
  // Non-empty for REPORT/REVOKE; ignored for CLEAR_ALL_AT_TIER.
  repeated string hashes = 3;

  // REPORT only. The resident component set for each hash at this tier, as a
  // REPLACE snapshot. When present it is index-aligned with `hashes`; when empty
  // every hash is treated as legacy whole-block (base component only). REVOKE and
  // CLEAR_ALL_AT_TIER ignore it.
  repeated ComponentSet component_sets = 4;

  // REPORT only. The token count (block_size) of each hash, index-aligned with
  // `hashes`, used to accumulate trailing windows in tokens. Empty when the
  // reporter does not supply sizes (legacy).
  repeated uint32 block_sizes = 5;
}

message ApplyExternalKvBatchRequest {
  string worker_id = 1;
  // The SGLang batch sequence number, monotonic per worker. Carried for
  // observability only: this build applies every batch it receives and does not
  // deduplicate, fence, or checkpoint on it.
  uint64 seq = 2;
  repeated ExternalKvAction actions = 3;
  // The worker's KV-transfer address, used to populate MatchExternalKvResponse.
  // Supplied by the bridge; may be empty, in which case matches for this worker
  // carry an empty address.
  string worker_address = 4;

  // Field 5 held the worker incarnation token used for restart fencing.
  reserved 5;

  // The worker's component cache spec. Carried on every batch (like
  // worker_address) so it self-heals across reconnects and indexer restarts.
  // Absent means a legacy / full-only worker.
  WorkerCacheSpec cache_spec = 6;
}

// Deliberately empty: applies are unconditional, so there is nothing to report
// back. Kept as a message so the RPC signature stays stable.
message ApplyExternalKvBatchResponse {
  // Fields 1-3 held the durable seq checkpoint and duplicate flag.
  reserved 1, 2, 3;
}

message TierHashes {
  TierType tier = 1;
  repeated string hashes = 2;
}

message ExternalKvNodeMatch {
  string worker_id = 1;
  string address = 2;
  repeated TierHashes hashes_by_tier = 3;
}

message MatchExternalKvResponse {
  repeated ExternalKvNodeMatch matches = 1;
}

message MatchExternalKvPrefixRequest {
  // Block hashes in prompt order. hashes[0] MUST be the request's first block:
  // prefix matching starts there and stops at the first block a worker is
  // missing, so a misordered list silently truncates every match.
  repeated string hashes = 1;

  // Caller-supplied ceiling on how many leading blocks to consider, so the
  // caller bounds its own query cost. 0 means "no caller ceiling"; the server
  // still bounds the scan with its own limit.
  uint32 max_blocks = 2;
}

message ExternalKvPrefixMatch {
  // The worker's router-facing routing identity, NOT its KV-transfer address.
  // The router intersects this byte-for-byte with the worker URLs it registered,
  // so a mismatch makes the intersection always empty and silently disables
  // cache-aware routing. Workers with an empty address are unroutable and are
  // excluded from this response entirely.
  string worker_address = 1;

  // Largest n such that this worker holds hashes[0..n) contiguously.
  uint32 matched_prefix_blocks = 2;

  // Opaque worker id, carried for the caller's logs only; not a routing key.
  string worker_id = 3;
}

message MatchExternalKvPrefixResponse {
  // Matches sorted by matched_prefix_blocks, descending.
  repeated ExternalKvPrefixMatch matches = 1;

  // The longest contiguous prefix held by any single worker (0 when no match).
  uint32 best_prefix_blocks = 2;

  // How many blocks the server actually read placement for. Lets early
  // termination and truncation be observed; it is NOT part of the prefix
  // semantics, so different backends may report different values for the same
  // matches.
  uint32 blocks_read = 3;
}

message HitCountEntry {
  string hash = 1;
  uint64 hit_count_total = 2;
}

message GetExternalKvHitCountsRequest {
  repeated string hashes = 1;
}

message GetExternalKvHitCountsResponse {
  repeated HitCountEntry entries = 1;
}

service KVIndexer {
  // The sole mutation API: applies an ordered SGLang KVEventBatch.
  rpc ApplyExternalKvBatch(ApplyExternalKvBatchRequest) returns (ApplyExternalKvBatchResponse);

  rpc MatchExternalKv(MatchExternalKvRequest) returns (MatchExternalKvResponse);

  // Answers, per worker, how long a contiguous prefix of the request it holds.
  // The indexer deliberately does not pick a worker: it cannot see the router's
  // health checks, circuit breakers, PD-pool split or in-flight load, so the
  // final choice stays with the router.
  rpc MatchExternalKvPrefix(MatchExternalKvPrefixRequest) returns (MatchExternalKvPrefixResponse);

  rpc GetExternalKvHitCounts(GetExternalKvHitCountsRequest) returns (GetExternalKvHitCountsResponse);
}
